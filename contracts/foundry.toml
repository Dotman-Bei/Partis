[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"   # BOT Chain implements EIP-4844 (see docs/BOT_CHAIN_CONFIG.md)
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[rpc_endpoints]
# Values verified 2026-10-07 from dev-docs.botchain.ai — re-verify before deploying.
bot_testnet = "https://rpc.bohr.life"
bot_mainnet = "https://rpc.botchain.ai"

[etherscan]
bot_testnet = { key = "blockscout", chain = 968, url = "https://scan.bohr.life/api/" }
bot_mainnet = { key = "blockscout", chain = 677, url = "https://scan.botchain.ai/api/" }

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[profile.ci.invariant]
runs = 256
depth = 128
